# EdgeLab configuration
storage: edgelab.db
costs_bps_per_side: 30          # small-caps are expensive to trade; be conservative
costs_bps_by_market:            # markets with extra taxes on trading (approximate; check your broker's schedule)
  ".L": 55                      # UK stamp duty: 0.5% on purchases (AIM shares are exempt)
  ".HK": 45                     # Hong Kong stamp duty and levies on both sides

universe:
  tickers_file: universe.txt    # one ticker per line (small/micro-caps you want covered)
  benchmark: IWM                # US benchmark (Russell 2000 ETF)
  benchmarks:                   # each market is judged against its own benchmark, never against the US one.
    ".T": 1306.T                # A market without an entry (or whose ticker has no data) is measured against the
    ".TO": XIC.TO               # average of its own stocks in your universe, if there are at least 8 of them.
    ".V": XIC.TO
    ".L": ISF.L
    ".DE": EXS1.DE
    ".HK": 2800.HK
    ".AX": STW.AX
  history_days: 600

llm:
  provider: anthropic           # needs ANTHROPIC_API_KEY in your environment
  model: claude-haiku-5-5       # locked version: never change mid-test without resetting the tournament
  temperature: 0
  prompt_version: v3           # v3 = multilingual + documents fenced off as untrusted data (v1, v2 kept for reproducibility)
  training_cutoff: 2026-06-30   # documents dated on/before this are REFUSED (contamination guard)
  cache_dir: .llm_cache

sec:
  user_agent: "JV Bramwell jvbramwell@gmail.com"   # SEC asks automated tools for a name and contact e-mail

tournament:
  min_trades: 40                # settled paper trades before a signal gets its first review (then at 80, 160, ...)
  lab_min_trades: 80            # stricter bar for experimental (lab) signals (reviews at 80, 160, 320, ...)
  min_weeks: 8                  # trades must be spread over at least this many different entry weeks
  fdr_q: 0.10                   # Benjamini-Hochberg false discovery rate
  retire_window: 30             # recent trades checked for decay
  retire_t: -1.0                # retire if recent t-stat falls below this

risk:
  kelly_fraction: 0.25          # quarter-Kelly
  max_position: 0.05            # 5% of equity per position
  max_gross: 1.0                # no leverage
  monthly_loss_cap: 0.04        # stop opening positions after -4% month-to-date
  drawdown_halve_at: 0.15       # halve sizing after a 15% drawdown from peak
  fragility:
    window: 60
    warm_sessions: 250          # history measured on the very first run, so the gauge has something to rank against
    calm_below: 0.6             # full exposure while fragility score < 0.6
    floor: 0.25                 # never below 25% of normal exposure

broker:
  provider: ibkr                # alpaca | ibkr
  base_url: https://paper-api.alpaca.markets   # Alpaca PAPER. Non-paper URLs are refused unless allow_live: true
  allow_live: false             # applies to every broker; keep false
  ibkr:                         # Interactive Brokers via TWS / IB Gateway on your machine
    host: 127.0.0.1
    port: 7497                  # 7497 TWS paper, 4002 Gateway paper. Live ports are refused unless allow_live
    client_id: 17
    account: ""                 # blank = first account on the connection; must start with DU (paper)
    base_currency: USD          # your account's base currency (e.g. CAD)
  extra_tradable: []            # e.g. [".KS"] ONLY if your IB account really has Korea/Taiwan/India permission
  lot_sizes: {}                 # per-stock board lots IB requires, e.g. {"0700.HK": 100}
  allow_shorts: false           # long-only by default; shorting small-caps is costly and risky
  min_order_dollars: 100
  dry_run: false                # true = print orders without sending

signals:
  insider_cluster: {enabled: true, min_cluster: 2, horizon: 20, min_history_days: 365}   # see `edgelab backfill`
  earnings_drift:  {enabled: true, min_abs_score: 0.4, horizon: 20}
  spinoff_orphan:  {enabled: true, wait_days: 10, min_drop: 0.05, horizon: 30}

api:
  cors_origins: []              # other origins allowed to call the API, e.g. a Tauri/Capacitor wrapper's origin

# Data sources. Each one that is enabled runs every day; a failing source is logged and skipped.
sources:
  edgar:         {enabled: true}              # US: Form 4, 8-K, Form 10 (no key)
  edinet:        {enabled: false}             # Japan large-stake filings; needs EDINET_API_KEY (free)
  tdnet:         {enabled: false}             # Japan earnings, forecast revisions, buybacks (community mirror)
  taiwan_sales:  {enabled: false}             # Taiwan monthly revenue for suppliers in supply_chain.yaml (no key)
  dart:          {enabled: false}             # Korea preliminary earnings, buybacks; needs DART_API_KEY (free)
  announcements:                              # any RSS/Atom feed, any language; Claude classifies each item
    enabled: false
    feeds: []                                 # e.g. [{url: "https://...", default_suffix: ".L"}]
  defense_contracts: {enabled: true}          # US: daily Pentagon contract awards of $7.5M+ (no key)
supply_chain_file: supply_chain.yaml

lab:
  earnings_drift_intl: {enabled: true, min_abs_score: 0.4, horizon: 20}
  insider_intl:        {enabled: true, min_cluster: 1, horizon: 20}
  large_stake:         {enabled: true, min_increase: 1.0, horizon: 30}   # stake up by >= 1 percentage point
  buyback:             {enabled: true, min_pct: 1.0, horizon: 20}        # >= 1% of shares outstanding
  supply_chain:        {enabled: true, min_accel: 0.10, min_abs_score: 0.5, horizon: 20}
  # Added 2026-11-19, thresholds fixed before any results. Changing one later = a new entry name.
  gov_contract:     {enabled: true, min_ratio: 0.02, horizon: 20}     # award >= 2% of a year's trading value
  cascade_rebound:  {enabled: true, days: 3, min_drop: 0.15, min_sigma: 3.0, min_volume_x: 2.0, horizon: 5}
  tax_loss_rebound: {enabled: true, start: "12-15", min_loss: 0.30, near_low: 0.15, horizon: 20}
  herding_fade:
    enabled: true
    gap_sigma: 2.0              # move must exceed 2x recent daily volatility
    max_substance: 0.35         # LLM substance score at or below this = hype headline
    horizon: 3
    feeds: []                   # RSS/Atom URLs of press-release or news feeds

# E-mail the daily paper report (`edgelab email-report`). Only the server details live here. The recipient,
# sender, login and app password come from the environment variables EDGELAB_MAIL_TO, EDGELAB_MAIL_FROM,
# EDGELAB_SMTP_USER and EDGELAB_SMTP_PASSWORD (same Gmail account and app-password approach as TWIS).
mail:
  enabled: true
  host: smtp.gmail.com
  port: 587
  security: starttls
  dashboard_url: https://preview.edgelab-dashboard.pages.dev   # the e-mail's button (behind Cloudflare Access)
